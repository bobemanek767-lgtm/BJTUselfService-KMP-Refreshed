name: Windows Transcript Installer
on:
  push:
    branches: [build/windows-transcript]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-transcript-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      BJTU_PACKAGE_BUILD_ID: ${{ github.run_number }}.${{ github.run_attempt }}
      BJTU_TRANSCRIPT_FULL_RUNTIME: '1'
      WINDOWS_PACKAGE_UPGRADE_UUID: 33e801db-8b5f-4909-a42d-20bc02acb6bc
      WINDOWS_PACKAGE_NAME: BJTUTranscript
      WINDOWS_PACKAGE_DESCRIPTION: 交大自由行 Windows 本地课堂语音转写版
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8 -Duser.language=zh -Duser.country=CN -Duser.timezone=Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: windows-transcript-gradle-${{ hashFiles('multiplatform/gradle/libs.versions.toml', 'multiplatform/gradle/wrapper/gradle-wrapper.properties') }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: android-actions/setup-android@v4
      - name: Install speech runtime build dependencies
        run: python -m pip install -r tools/transcription/requirements.txt imageio-ffmpeg pyinstaller
      - name: Test transcription logic
        run: python -m unittest discover -s tools/transcription -v
      - name: Freeze standalone speech worker
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --name BJTUTranscriptWorker --paths tools/transcription --collect-all faster_whisper --collect-all ctranslate2 --collect-all av --collect-all onnxruntime --collect-all tokenizers --collect-all huggingface_hub --collect-all imageio_ffmpeg tools/transcription/worker.py
          if ($LASTEXITCODE -ne 0) { throw 'Worker freezing failed' }
          & ./dist/BJTUTranscriptWorker/BJTUTranscriptWorker.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Frozen worker smoke test failed' }
          Compress-Archive -Path dist/BJTUTranscriptWorker/* -DestinationPath multiplatform/shared/src/desktopMain/resources/transcription/runtime.zip -CompressionLevel Optimal
      # Shared Windows tests already passed in run 45570448127.
      # This revision changes packaging only; packageMsi recompiles the app.
      - name: Build Windows installer
        shell: pwsh
        working-directory: multiplatform
        run: |
          $env:WINDOWS_PACKAGE_JAVA_HOME = $env:JAVA_HOME
          ./gradlew.bat :windowsApp:packageMsi --no-daemon --no-configuration-cache --max-workers=2
          if ($LASTEXITCODE -ne 0) { throw 'MSI packaging failed' }
          $msi = Get-ChildItem windowsApp/build/compose/binaries/main/msi/*.msi | Select-Object -First 1
          if (-not $msi) { throw 'Missing MSI installer' }
          New-Item -ItemType Directory -Force ../installer-output | Out-Null
          Copy-Item $msi.FullName ../installer-output/BJTU-Windows-Transcript.msi
          Get-FileHash ../installer-output/BJTU-Windows-Transcript.msi -Algorithm SHA256 | Format-List | Out-File ../installer-output/SHA256.txt
      - name: Install and launch smoke test
        shell: pwsh
        run: |
          $msi = (Resolve-Path installer-output/BJTU-Windows-Transcript.msi).Path
          $install = Start-Process msiexec.exe -ArgumentList @('/i', ('"' + $msi + '"'), '/qn', '/norestart') -Wait -PassThru
          if ($install.ExitCode -notin @(0,3010)) { throw "MSI installation failed: $($install.ExitCode)" }
          $exe = Join-Path $env:ProgramFiles ($env:WINDOWS_PACKAGE_NAME + '/' + $env:WINDOWS_PACKAGE_NAME + '.exe')
          if (-not (Test-Path $exe)) { throw 'Installed application executable missing' }
          Get-Content (Join-Path (Split-Path $exe) 'app/*.cfg') | Out-File installer-output/LAUNCH-CONFIG.txt
          Remove-Item Env:JAVA_TOOL_OPTIONS -ErrorAction SilentlyContinue
          $app = Start-Process -FilePath $exe -PassThru -RedirectStandardOutput installer-output/APP-STDOUT.txt -RedirectStandardError installer-output/APP-STDERR.txt
          if ($app.WaitForExit(15000)) {
            Get-Content installer-output/APP-STDOUT.txt,installer-output/APP-STDERR.txt
            Get-Content installer-output/LAUNCH-CONFIG.txt
            throw "Application exited during startup: $($app.ExitCode)"
          }
          Stop-Process -Id $app.Id -Force
          'MSI installation and 15-second startup smoke test passed.' | Out-File installer-output/VALIDATION.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BJTU-Windows-Transcript-Installer
          path: installer-output/*
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Windows-Build-Diagnostics
          path: |
            multiplatform/windowsApp/build/compose/logs/
            multiplatform/shared/build/test-results/
            build/BJTUTranscriptWorker/warn-BJTUTranscriptWorker.txt
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: windows-transcript-gradle-${{ hashFiles('multiplatform/gradle/libs.versions.toml', 'multiplatform/gradle/wrapper/gradle-wrapper.properties') }}
